name: CI/CD Pipeline Microservicios
on:
  push:
    branches:
      - deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v3

    - name: Configurar credenciales de AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN}}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login en Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    # ==========================================
    # DESPLIEGUE DE VENTAS
    # ==========================================
    - name: Construir y subir imagen de VENTAS
      working-directory: ./Springboot-API-REST-VENTA
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ev2/back-ventas
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Actualizar contenedor VENTAS 
      run: |
        aws ssm send-command \
          --instance-ids "${{ secrets.INSTANCE_ID_VENTAS }}" \
          --document-name "AWS-RunShellScript" \
          --parameters '{"commands":[
            "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
            "docker pull ${{ steps.login-ecr.outputs.registry }}/ev2/back-ventas:latest",
            "cd /home/ec2-user/ventas",
            "docker-compose down",
            "docker-compose up -d"
          ]}'

    # ==========================================
    # DESPLIEGUE DE DESPACHO
    # ==========================================
    - name: Construir y subir imagen de DESPACHO
      working-directory: ./Springboot-API-REST-DESPACHO
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ev2/back-despacho
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

    - name: Actualizar contenedor DESPACHO vía SSM
      run: |
        aws ssm send-command \
          --instance-ids "${{ secrets.INSTANCE_ID_DESPACHO }}" \
          --document-name "AWS-RunShellScript" \
          --parameters '{"commands":[
            "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
            "docker pull ${{ steps.login-ecr.outputs.registry }}/ev2/back-despacho:latest",
            "cd /home/ec2-user/despacho",
            "docker-compose down",
            "docker-compose up -d"
          ]}'
        