version: '3.8'
services:
  db-ventas:
    image: mysql:8.0
    container_name: mysql-ventas
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_ventas
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ventas_db_data:/var/lib/mysql
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  ventas-app:
    image: ${IMAGE_URL}
    container_name: app-ventas
    restart: always
    ports:
      - "8081:8080"
    environment:
      - DB_ENDPOINT=db-ventas
      - DB_PORT=3306
      - DB_NAME=db_ventas
      - DB_USERNAME=admin
      - DB_PASSWORD=password
    depends_on:
      db-ventas:
        condition: service_healthy
    networks:
      - backend_network

volumes:
  ventas_db_data:

networks:
  backend_network: