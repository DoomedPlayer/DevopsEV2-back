version: '3.8'
services:
  db-despacho:
    image: mysql:8.0
    container_name: mysql-despacho
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_despacho
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - despacho_db_data:/var/lib/mysql
    networks:
      - backend_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  despacho-app:
    image: ${IMAGE_URL}
    container_name: app-despacho
    restart: always
    ports:
      - "8082:8080"
    environment:
      - DB_ENDPOINT=db-despacho
      - DB_PORT=3306
      - DB_NAME=db_despacho
      - DB_USERNAME=admin
      - DB_PASSWORD=password
    depends_on:
      db-despacho:
        condition: service_healthy
    networks:
      - backend_network

volumes:
  despacho_db_data:

networks:
  backend_network: